name: windows-release

# Produces the signed DroidFarm.msi + DroidFarm.exe NSIS installers
# on every tag push (v*) and on manual dispatch, so the user doesn't
# need a local Windows box to ship releases.
#
# The bundled output in src-tauri/target/release/bundle/:
#   msi/DroidFarm_<ver>_x64_en-US.msi
#   nsis/DroidFarm_<ver>_x64-setup.exe
# Both include the backend tree + frontend/dist as resources, and
# run the Python backend as a child process on launch.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      # Harden cargo against flaky GitHub runner networking.
      CARGO_NET_RETRY: "10"
      CARGO_NET_TIMEOUT: "60"
      CARGO_HTTP_MULTIPLEXING: "false"
      # npm retry knobs.
      NPM_CONFIG_FETCH_RETRIES: "5"
      NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "20000"
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "120000"
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps (with retry)
        working-directory: frontend
        shell: pwsh
        run: |
          $max = 3
          for ($i = 1; $i -le $max; $i++) {
            npm ci
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host "npm ci attempt $i failed; sleeping 15s"
            Start-Sleep -Seconds 15
            if ($i -eq $max) { throw "npm ci failed after $max attempts" }
          }

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build Tauri installers
        uses: tauri-apps/tauri-action@v0.5.15
        with:
          projectPath: src-tauri
          includeRelease: true
          includeDebug: false
          tagName: ${{ github.ref_name }}
          releaseName: "DroidFarm ${{ github.ref_name }}"
          releaseBody: |
            One-click Windows installers for DroidFarm.

            - **DroidFarm_*.msi** — classic MSI installer (admin-friendly).
            - **DroidFarm_*-setup.exe** — NSIS installer, installs per-user.

            Both installers bundle the Python backend + React UI.
            Python 3.11+ is required on the target machine; if absent the
            first launch will fail with a dialog pointing to DroidFarm.bat
            which installs Python silently via winget.
          releaseDraft: true
          prerelease: false

      - name: Upload installers
        if: startsWith(github.ref, 'refs/tags/') == false
        uses: actions/upload-artifact@v4
        with:
          name: droidfarm-windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
